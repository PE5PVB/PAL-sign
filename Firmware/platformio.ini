; One board: a bare RP2350, no vendor dev board.
;
; The pin map is NOT here but in src/board.h.
;
; default_envs stays even with one environment: a bare "pio run -t
; upload" then keeps meaning exactly this board, whatever gets added
; later.
[platformio]
default_envs = palsign

; The sketch file has to sit in the root of its own folder for the
; Arduino IDE, and it carries the main tab, so PlatformIO is pointed at
; the root as well and told exactly what to build from there. Without the
; filter it would walk into .pio and tools.
src_dir = .

[env]
; Firmware.ino.cpp and not Firmware.ino: PlatformIO preprocesses the
; sketch file into a .cpp next to it and removes that again when the
; build ends, so what has to be compiled is the .cpp.
build_src_filter =
    +<Firmware.ino.cpp>
    +<src/>

platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
monitor_speed = 115200
board_build.arduino.earlephilhower.usb_product = PAL-sign board

; Sysclk has to be a multiple of 54 MHz: the PIO program takes 2
; instructions per byte, so sysclk / divider / 2 = 27 MHz. The divider
; must be a whole number, otherwise CLKIN gets jitter. The firmware works
; the divider out from this value itself and prints the resulting CLKIN
; frequency at startup as a check.
;
; The RP2350 is specified up to 150 MHz, so 108 is the highest multiple
; of 54 that stays inside that. 162 MHz (8% over spec) fails to boot
; some of the time on this board, and 216 MHz (44% over spec) never
; boots at all; do not raise this without testing on real hardware.
;
; When changing this: check in the serial output that starves stays at 0,
; that txstall stays at 0, and that the average line building time stays
; under 64 us.
board_build.f_cpu = 108000000L

build_unflags =
    -Os
; No -I src. The test cards in src/testcards/ reach the headers a
; directory up with ../, which every compiler resolves against the
; including file, so the same sources build under the Arduino IDE as
; well. See the head of Firmware.ino.
build_flags =
    -DDEBUG_RP2040_PORT=Serial
    -O2
    ; This board uses the RP2350A package (30 GPIO), not the generic
    ; board's own RP2350B default. See src/board.h.
    -D__PICO_RP2350A=1
    ; The generic board does not declare a PSRAM CS pin by itself; GP8
    ; is wired for it here even though no PSRAM chip is populated. See
    ; src/board.h.
    -DRP2350_PSRAM_CS=8

; --- a bare RP2350, no PSRAM populated ------------------------------
[env:palsign]
board = generic_rp2350

; Reserve the last part of the flash instead of giving it to the
; firmware. The fifteen uploadable photographs live there and are sent
; over the serial port; see src/photoflash.h. The builder supplies the
; linker symbols _FS_start and _FS_end for it and takes it off the sketch
; space:
;
;   flash total      16777216
;   EEPROM emulation     4096   (the last 4 kB, fixed)
;   reserved here    12795904   (13 MB minus one 835584 byte photo slot)
;   sketch space      3977216
;
; A slot is 204 sectors of 4 kB and the settings take one more after the
; last of them, so this is what sets FOTO_SLOTS in src/photoflash.h. A
; sixteenth slot was traded for this sketch space, 26 augustus 2026.
board_build.filesystem_size = 12795904
